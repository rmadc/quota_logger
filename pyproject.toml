[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quota-logger"
version = "0.1.0"
description = "A multi-provider quota history collector for local LLM tools"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
quota-logger = "quota_logger.collector:main"
quota-history = "quota_logger.history:main"
quota-config = "quota_logger.config:app_main"

[tool.setuptools]
packages = ["quota_logger", "quota_logger.providers"]
